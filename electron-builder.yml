# 웜홀 모니터 패키징 설정 (비둘기 모니터와 같은 구조)
# - 맥: 유니버설(arm64+x64) dmg + zip(자동 업데이트용). 맥북에서 빌드 (scripts/build-mac.mjs).
#   서명: ~/.minimi-signing 의 Developer ID 인증서 + build/certs/DeveloperIDG2CA.cer(중간 인증서)
#   공증: 키체인 프로필 minimi-notary
# - 윈도우: 서명 없이 NSIS. 파일명 고정(WormholeMonitor-Setup.exe) — 버전을 붙이면 SmartScreen 평판이 초기화된다.
# - koffi(창 읽기·옮기기·커서 이동용 FFI) 네이티브 모듈은 node_modules 대신 extraResources 로 넣는다
appId: com.wormholemonitor.app
# 맥에서 번들/헬퍼 이름이 한글이면 Electron 이 시작 시 크래시 → 파일 이름은 영문, 표시 이름만 한글
productName: WormholeMonitor
copyright: Copyright © 2026 wormhole-monitor
npmRebuild: false
directories:
  output: dist
  buildResources: build
electronLanguages: [ko, en]
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/renderer/lab.html'
  - '!node_modules/@koromix/**'
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  x64ArchFiles: '**/koffi/**'
  extraResources:
    - from: build/koffi/darwin_x64
      to: koffi/darwin_x64
      filter: [koffi.node]
    - from: build/koffi/darwin_arm64
      to: koffi/darwin_arm64
      filter: [koffi.node]
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: WormholeMonitor-mac.${ext}
  extendInfo:
    CFBundleDisplayName: 웜홀 모니터
    NSHumanReadableCopyright: Copyright © 2026 wormhole-monitor
    NSScreenCaptureUsageDescription: 골인 장면을 실제 화면 그대로 녹화하려면 화면 기록 권한이 필요해요.
    NSAccessibilityUsageDescription: 구슬·화살·폭탄에 맞은 다른 앱 창을 밀어내려면 손쉬운 사용 권한이 필요해요.
dmg:
  title: 웜홀 모니터
  # dmg 도 서명 (공증·스테이플은 scripts/build-mac.mjs)
  sign: true
  artifactName: WormholeMonitor-mac.dmg
  window:
    width: 540
    height: 380
win:
  executableName: WormholeMonitor
  icon: build/icon.png
  extraResources:
    - from: build/koffi/win32_x64
      to: koffi/win32_x64
      filter: [koffi.node]
  target:
    - target: nsis
      arch: x64
  artifactName: WormholeMonitor-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 웜홀 모니터
  artifactName: WormholeMonitor-Setup.${ext}
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: kanchoooo
  repo: wormhole-monitor
  releaseType: draft
